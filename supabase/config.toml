# Настройки проекта для Supabase CLI.
#
# Нужны прежде всего для развёртывания функций из CI: без них CLI поставил
# бы проверку JWT по умолчанию, и телеграм перестал бы доходить — вебхук
# приходит от телеграма, у которого никакого нашего токена нет.

project_id = "esla"

[functions.telegram-bot]
# Вебхук телеграма и разовая настройка. Подлинность запроса функция
# проверяет сама: по заголовку, который умеет подделать только владелец
# токена бота.
verify_jwt = false

[functions.notify-relatives]
# Тревогу от приложения функция проверяет сама — читает токен входа и
# узнаёт, кто его прислал. Обход от расписания авторизации не требует
# намеренно, причина описана в самой функции.
verify_jwt = false
