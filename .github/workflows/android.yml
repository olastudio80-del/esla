# Сборка APK для Android.
#
# Собираем здесь, а не через EAS: expo.dev закрыт в окружении разработки,
# а у раннеров GitHub Android SDK уже установлен. На выходе — APK в артефактах
# сборки, его можно скачать и поставить на телефон напрямую.
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установить зависимости
        run: npm ci

      # Проверки до сборки: собирать сломанный код незачем.
      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Тесты
        run: npm test

      - name: Линтер
        run: npx eslint .

      # android/ не лежит в репозитории — его создаёт prebuild из app.json.
      - name: Сгенерировать нативный проект
        run: npx expo prebuild --platform android --no-install

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: esla-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
