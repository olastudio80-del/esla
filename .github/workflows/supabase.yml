# Развёртывание функций Supabase из репозитория.
#
# Руками их возить нельзя: код функций и схема базы должны совпадать с тем,
# что лежит в git, иначе никто потом не скажет, какая версия работает.
# Миграции базы здесь не применяются — для них нужен пароль базы, и
# выполнять их лучше осознанно, а не на каждый коммит.
name: Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Без токена доступа работа не падает, а сообщает, чего не хватает:
      # красный значок на каждом коммите приучает его не замечать.
      - name: Проверить доступ
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Нет секрета SUPABASE_ACCESS_TOKEN — развёртывание пропущено."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Развернуть функции
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Ссылка на проект не секрет: она же лежит в app.json и внутри APK.
        run: supabase functions deploy --project-ref rjakxtcpumdqjqzufskh
